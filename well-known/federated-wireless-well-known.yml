generated: '2026-08-12'
method: searched
source: probed /.well-known/* on every Federated Wireless host reachable from the public internet
description: >-
  Well-known discovery surface probed across every Federated Wireless host. The single real find is
  on federatedwireless.ai, the company's primary (post-rename) marketing host, which publishes BOTH
  RFC 8414 OAuth authorization-server metadata and RFC 9728 OAuth protected-resource metadata
  pointing at a remote Model Context Protocol server at
  https://federatedwireless.ai/wp-json/mcp/mcp-oauth-server. No security.txt (RFC 9116), no
  api-catalog (RFC 9727), no OIDC discovery document and no A2A agent card were found on any host.
  Two hosts are pure soft-200 traps and every 200 on them was rejected: the legacy
  federatedwireless.com WordPress site answers HTTP 200 with a 131 KB HTML page for every
  /.well-known/* path, and spectrum.federatedwireless.com (the Spectrum Controller single-page app on
  CloudFront/S3) answers HTTP 200 with the same 1,445-byte index.html for every path.
hosts:
