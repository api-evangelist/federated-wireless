  note: >-
    Primary company host since the 2026 rename from federatedwireless.com. WordPress.com-hosted
    (host-header: WordPress.com). The OAuth metadata is platform-provided by the WordPress MCP
    integration but is served from the company's own domain and names that domain as issuer.
  documents:
  - path: /.well-known/oauth-authorization-server
    status: 200
    content_type: application/json; charset=UTF-8
    file: federated-wireless-oauth-authorization-server.json
    note: >-
      RFC 8414 — issuer https://federatedwireless.ai, single scope `mcp`, authorization_code +
      refresh_token, PKCE S256 required, public clients (token_endpoint_auth_methods_supported
      ["none"]), client_id_metadata_document_supported true. Served after a 301 to the
      trailing-slash form.
  - path: /.well-known/oauth-protected-resource
    status: 200
    content_type: application/json; charset=UTF-8
    file: federated-wireless-oauth-protected-resource.json
    note: >-
      RFC 9728 — resource https://federatedwireless.ai/wp-json/mcp/mcp-oauth-server,
      authorization_servers [https://federatedwireless.ai], bearer in header, scope `mcp`.
