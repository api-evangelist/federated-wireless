undocumented_surfaces:
- surface: Spectrum Controller external SAS API
  base_url: https://spectrum-api.federatedwireless.com/v1
  observed: >-
    HTTP 403 {"message": "Missing Authentication Token"}; x-amzn-errortype
    MissingAuthenticationTokenException. AWS API Gateway
    (d-d3psb9cl3e.execute-api.us-west-2.amazonaws.com). No WWW-Authenticate header, so the scheme
    (IAM SigV4, Cognito authorizer, API key or custom Lambda authorizer) is not observable anonymously.
- surface: Spectrum IAM API
  base_url: https://spectrum-iam.federatedwireless.com/v1
  observed: HTTP 403 MissingAuthenticationTokenException. AWS API Gateway behind CloudFront.
  note: >-
    The name and the fact that the Spectrum Controller web app calls it as IAM_BASE_URL indicate this
    is the identity/session service for the customer portal, but no scheme is published.
- surface: Spectrum KPI / analytics + reporting API
  base_url: https://spectrum-kpi.federatedwireless.com/v2.0
  observed: HTTP 403 MissingAuthenticationTokenException. AWS API Gateway behind CloudFront.
- surface: SAS-CBSD interface
  base_url: https://sas.federatedwireless.com
  observed: TCP 443 refused from the public internet; DNS resolves to 35.166.171.66 (AWS us-west-2).
  expected_scheme: >-
    Mutual TLS with CBSD client certificates, per WInnForum WINNF-TS-0016 (SAS to CBSD Technical
    Specification) and FCC Part 96. Recorded as the regulated protocol's requirement, NOT as an
    observation — no handshake was completed.
- surface: 6 GHz AFC device interface
  base_url: https://afc.federatedwireless.com
  observed: >-
    TCP 443 refused from the public internet; DNS resolves to an AWS ELB
    (a98859f24fc724909b8a256a877bbb50-431290955.us-west-2.elb.amazonaws.com).
  expected_scheme: >-
    Certified-device / proxy authentication per the WInnForum AFC System to AFC Device interface.
    Recorded as the protocol's requirement, not as an observation.
- surface: MyFederated customer portal
  base_url: https://myfederated.federatedwireless.com
  observed: >-
    Zendesk-hosted (federatedwirelessinc.zendesk.com). /hc/en-us returns 403 to an anonymous visitor;
    only the Help Center REST API is open, and it exposes six FAQ articles about course access and
    password resets. Sign-in required for everything else.
