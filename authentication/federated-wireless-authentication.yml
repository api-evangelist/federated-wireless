docs: null
description: >-
  Federated Wireless publishes no OpenAPI or Swagger document on any host, so this profile could not
  be derived from securitySchemes. It was assembled entirely from live probes. There is exactly one
  publicly documented authentication mechanism — the OAuth 2.1 authorization server that fronts the
  MCP server on federatedwireless.ai. Every other Federated Wireless API surface is authenticated but
  undocumented: the three Spectrum Controller AWS API Gateway endpoints return 403
  MissingAuthenticationTokenException to anonymous callers without advertising a scheme, and the
  regulated SAS-CBSD and 6 GHz AFC interfaces are not reachable from the public internet at all.
summary:
  types: [oauth2]
  api_key_in: []
  oauth2_flows: [authorizationCode]
  documented_publicly: false
  note: >-
    `types` lists only what is observable. It is a floor, not a complete picture — the product APIs
    certainly authenticate, but Federated Wireless publishes nothing that says how.
schemes:
- name: FederatedWirelessMCPOAuth
  type: oauth2
  source: https://federatedwireless.ai/.well-known/oauth-authorization-server
  applies_to: https://federatedwireless.ai/wp-json/mcp/mcp-oauth-server
  issuer: https://federatedwireless.ai
  flows:
  - flow: authorizationCode
