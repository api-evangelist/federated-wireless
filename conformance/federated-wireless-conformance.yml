source: >-
  https://federatedwireless.ai/services-definition/ + https://federatedwireless.ai/products/6ghz/ +
  FCC OET public notices + live probes
description: >-
  Federated Wireless is a regulated spectrum-coordination operator, so its meaningful conformance is
  to radio-regulatory and Wireless Innovation Forum (WInnForum) specifications rather than to
  web-API standards. It is one of the FCC-certified CBRS Spectrum Access System administrators and
  one of the seven 6 GHz Automated Frequency Coordination systems the FCC Office of Engineering and
  Technology approved for commercial operation in February 2024. Against web-API standards the
  posture is thin: the only conformant surfaces are the OAuth 2.1 / RFC 8414 / RFC 9728 metadata
  documents that front the MCP server, and there is no OpenAPI, AsyncAPI, GraphQL, JSON:API or
  RFC 9457 surface anywhere public to assess.
standards:
- id: fcc-part-96
  name: FCC 47 CFR Part 96 — Citizens Broadband Radio Service
  conforms: true
  evidence: >-
    Federated Wireless is an FCC-certified CBRS Spectrum Access System administrator; the company's
    own Services Definition page states compliance with FCC Part 96 and WINNF specifications.
  source: https://federatedwireless.ai/services-definition/
- id: winnf-ts-0016-sas-cbsd
  name: WInnForum WINNF-TS-0016 — SAS to CBSD Technical Specification
  conforms: true
  evidence: >-
    Operating a certified SAS requires implementing the SAS-CBSD protocol (registration, spectrum
    inquiry, grant, heartbeat, relinquishment, deregistration). Federated Wireless markets a
    "Deregistration API" — a named operation from this protocol — on its CBRS product page, and
    states its platform "works with any CBSD". The company runs sas.federatedwireless.com for it.
  source: https://federatedwireless.ai/products/cbrs/
  note: >-
    Conformance is asserted from the FCC certification and the company's own claims. The interface
    itself refuses connections from the public internet, so it was NOT independently verified here.
- id: winnf-afc-system-device-interface
  name: WInnForum AFC System to AFC Device Interface (6 GHz)
  conforms: true
  evidence: >-
    On 2024-02-23 the FCC OET announced approval of seven 6 GHz band AFC systems for commercial
    operation, Federated Wireless, Inc. among them, covering U-NII-5 (5.925–6.425 GHz) and U-NII-7
    (6.525–6.875 GHz) for standard-power access points and fixed clients. Approval required passing
    the WInnForum/Wi-Fi Alliance test vectors reviewed by OET.
  source: https://www.fcc.gov/document/oet-announces-approval-seven-6-ghz-band-afc-systems
