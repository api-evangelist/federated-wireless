  challenge: 'An anonymous JSON-RPC call returns 401 with a spec-correct RFC 9728 challenge — www-authenticate:
    Bearer realm="https://federatedwireless.ai", resource_metadata="https://federatedwireless.ai/.well-known/oauth-protected-resource"'
tools:
