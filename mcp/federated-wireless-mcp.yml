    one would be fabrication. Enumerating the surface requires an authorized session.
related_surfaces:
  openapi: null
  note: Federated Wireless publishes no OpenAPI, Swagger, AsyncAPI or GraphQL contract on any host, so
    there is nothing to bind these tools to and no mcp/federated-wireless-tool-crosswalk.yml was written.
