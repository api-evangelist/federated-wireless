description: Federated Wireless publishes a remote Model Context Protocol server on its primary company
  host, federatedwireless.ai. It is not announced in any Federated Wireless documentation, press release
  or MCP registry — it was discovered by probing /.well-known/* , which returns both RFC 8414 authorization-server
  metadata and RFC 9728 protected-resource metadata naming the MCP endpoint. The server fronts the Federated
  Wireless WordPress content estate (the marketing site, product pages, blog and press releases), NOT
  the Spectrum Controller, the CBRS SAS or the 6 GHz AFC. An agent that authorizes against this server
  gains access to site content, not to spectrum operations. This is the WordPress.com platform MCP integration,
  served from the company's own domain and naming that domain as the OAuth issuer.
server:
  name: federated-wireless
  transport: http
  url: https://federatedwireless.ai/wp-json/mcp/mcp-oauth-server
  protocol: MCP over HTTP (JSON-RPC 2.0)
  implementation: WordPress REST namespace `mcp` on the Federated Wireless site (WordPress.com Atomic
    hosting, Divi theme, All in One SEO). Route `mcp/mcp-oauth-server`. The site's /wp-json/ index advertises
    both an `mcp` namespace and a `wp-abilities/v1` namespace across 858 registered REST routes.
