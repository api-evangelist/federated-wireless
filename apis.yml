- aid: federated-wireless:sas-cbsd-interface
  name: SAS-CBSD Interface
  description: >-
    The regulated Spectrum Access System to CBSD protocol interface Federated Wireless operates as an
    FCC-certified SAS administrator. The protocol — registration, spectrum inquiry, grant, heartbeat,
    relinquishment and deregistration — is defined by Wireless Innovation Forum WINNF-TS-0016 and FCC
    47 CFR Part 96, not by Federated Wireless; the company implements it and markets a
    "Deregistration API" from it. The interface is mutual-TLS and restricted to registered CBSD
    operators, so it is not reachable from the public internet and no contract is published.
  humanURL: https://federatedwireless.ai/products/cbrs/
  baseURL: https://sas.federatedwireless.com
  tags:
  - CBRS
  - SAS
  - Spectrum
  properties:
  - type: Conformance
    url: conformance/federated-wireless-conformance.yml
  - type: Specification
    name: WInnForum WINNF-TS-0016 SAS to CBSD Technical Specification
    url: https://winnf.memberclicks.net/assets/CBRS/WINNF-TS-0016.pdf
  x-evidence:
    dns: 35.166.171.66 (AWS us-west-2)
    http_status: 0
    reason: TCP 443 refused from the public internet
    base_url_note: >-
      The host exists and resolves to company-controlled AWS infrastructure, but no handshake was
      completed. The protocol it serves is the standards body's specification, which is deliberately
      NOT saved into openapi/ or elsewhere in this repo — it is not a Federated Wireless contract.
    fetched: '2026-08-12'
- aid: federated-wireless:afc-device-interface
  name: 6 GHz AFC Device Interface
  description: >-
    The Automated Frequency Coordination system interface Federated Wireless operates for the 6 GHz
    band. On 2024-02-23 the FCC Office of Engineering and Technology approved seven AFC systems for
    commercial operation, Federated Wireless among them, covering U-NII-5 (5.925-6.425 GHz) and
    U-NII-7 (6.525-6.875 GHz) for standard-power access points and fixed client devices. The
    availableSpectrumInquiry request/response contract is defined by the WInnForum AFC System to AFC
    Device interface specification, not by Federated Wireless. The endpoint is restricted to certified
    devices and proxies and is not reachable from the public internet.
  humanURL: https://federatedwireless.ai/products/6ghz/
  baseURL: https://afc.federatedwireless.com
  tags:
  - 6 GHz
  - AFC
  - Wi-Fi
  - Spectrum
  properties:
  - type: Conformance
    url: conformance/federated-wireless-conformance.yml
  x-evidence:
    dns: a98859f24fc724909b8a256a877bbb50-431290955.us-west-2.elb.amazonaws.com (AWS ELB)
    http_status: 0
    reason: TCP 443 refused from the public internet
    fcc_approval: https://www.fcc.gov/document/oet-announces-approval-seven-6-ghz-band-afc-systems
    fetched: '2026-08-12'
- aid: federated-wireless:mcp-server
  name: Federated Wireless MCP Server
  description: >-
    A remote Model Context Protocol server published on federatedwireless.ai, advertised through
    RFC 8414 OAuth authorization-server metadata and RFC 9728 protected-resource metadata. It is not
    announced in any Federated Wireless documentation or MCP registry — it was found by probing
    /.well-known/*. The server fronts the Federated Wireless WordPress content estate (marketing
    site, product pages, blog, press releases), not the Spectrum Controller or the spectrum platform.
    Authorization is OAuth 2.1 authorization-code with PKCE (S256), a single `mcp` scope, public
    clients (token_endpoint_auth_method none) and client-ID metadata documents. tools/list is
    authenticated — an anonymous JSON-RPC call returns 401 mcp_unauthorized with a spec-correct
    RFC 9728 challenge — so the live tool schemas require an authorized session.
  humanURL: https://federatedwireless.ai/
  baseURL: https://federatedwireless.ai/wp-json/mcp/mcp-oauth-server
  tags:
  - MCP
  - Agents
  - Content
  properties:
  - type: MCPServer
    url: mcp/federated-wireless-mcp.yml
  - type: OAuthScopes
    url: scopes/federated-wireless-scopes.yml
  - type: Authentication
    url: authentication/federated-wireless-authentication.yml
  x-evidence:
    protected_resource: https://federatedwireless.ai/.well-known/oauth-protected-resource
    authorization_server: https://federatedwireless.ai/.well-known/oauth-authorization-server
    http_status: 200
    tools_list_status: 401
    fetched: '2026-08-12'
