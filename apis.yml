apis:
- aid: federated-wireless:spectrum-controller-external-api
  name: Spectrum Controller External SAS API
  description: >-
    The external API of the Federated Wireless Spectrum Controller, the cloud platform that manages
    CBRS spectrum assignment, CBSD lifecycle, monitoring and compliance. The Spectrum Controller web
    application calls it as SAS_EXTERNAL_URL. Federated Wireless describes the surface on its CBRS
    product page as "vendor extensions and other APIs" for real-time analytics and KPI reporting, a
    Deregistration API for integrating SAS cost management into customer workflows, OEM onboarding
    and integration, and a common management interface for multi-OEM deployments. No reference
    documentation, OpenAPI definition or operation list is published; the endpoint returns HTTP 403
    MissingAuthenticationTokenException to anonymous callers.
  humanURL: https://federatedwireless.ai/products/cbrs/
  baseURL: https://spectrum-api.federatedwireless.com/v1
  tags:
  - CBRS
  - Spectrum
  - SAS
  properties:
  - type: Authentication
    url: authentication/federated-wireless-authentication.yml
  - type: RateLimits
    url: rate-limits/federated-wireless-rate-limits.yml
  x-evidence:
    base_url_source: https://spectrum.federatedwireless.com/configuration.js
    base_url_note: >-
      Read verbatim from SAS_EXTERNAL_URL in the Spectrum Controller web application's own
      unauthenticated configuration.js, served by the provider from its own CloudFront/S3 host. Not
      guessed from the domain.
    http_status: 403
    error_type: MissingAuthenticationTokenException
    infrastructure: AWS API Gateway (d-d3psb9cl3e.execute-api.us-west-2.amazonaws.com)
    fetched: '2026-08-12'
