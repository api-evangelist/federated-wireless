  reason: customer-only-docs
  detail: >-
    Federated Wireless ships real APIs and names them itself, but every one is behind a customer
    wall: the Spectrum Controller external SAS, IAM and KPI endpoints — whose base URLs the company's
    own public configuration.js discloses — return HTTP 403 MissingAuthenticationTokenException from
    AWS API Gateway, the MyFederated Zendesk help center 403s to anonymous visitors and exposes only
    six FAQ articles about course logins, and the regulated SAS-CBSD and 6 GHz AFC hosts resolve to
    company AWS infrastructure that refuses TCP 443 from the public internet. There is no developer
    portal, no docs subdomain and no machine-readable contract anywhere public.
