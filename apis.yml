aid: federated-wireless
name: Federated Wireless
description: >-
  Federated Wireless, founded in 2012 and headquartered in Arlington, Virginia, is a shared- and
  unlicensed-spectrum coordination company. It is one of the FCC-certified CBRS Spectrum Access
  System (SAS) administrators for the 3.5 GHz band, operates a nationwide Environmental Sensing
  Capability (ESC) network, and is one of the seven 6 GHz Automated Frequency Coordination (AFC)
  systems the FCC Office of Engineering and Technology approved for commercial operation in February
  2024. Its cloud-native platform — the Spectrum Controller, the Automated Network Planner (ANP) and
  the Spectrum AI physical-AI platform announced in June 2026 — assigns, monitors and optimizes
  spectrum for carriers, broadband providers, enterprises running private 5G/LTE, and government
  agencies. The programmable surface is real but almost entirely private: the regulated SAS-CBSD
  (WInnForum WINNF-TS-0016) and 6 GHz AFC device interfaces run on hosts that refuse public
  connections, and the Spectrum Controller's external SAS, IAM and KPI/analytics APIs are AWS API
  Gateway endpoints that return 403 to every anonymous request. Federated Wireless publishes no
  developer portal, no API reference and no machine-readable contract. The one openly discoverable
  agent surface is a remote Model Context Protocol server on federatedwireless.ai, advertised through
  RFC 8414 and RFC 9728 metadata, which fronts the company's WordPress content estate rather than its
  spectrum platform.
